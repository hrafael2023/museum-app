<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Museum App</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1b18; --muted: #6b665d; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #f1eee8; --muted: #a39e94; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
           font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--fg); }
    main { flex: 1; display: grid; place-content: center; text-align: center; padding: 24px 16px; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .5rem; letter-spacing: .02em; }
    p { color: var(--muted); margin: 0; font-size: 1.1rem; }
    footer { text-align: center; padding: 16px; color: var(--muted); font: .85rem system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Museum App</h1>
    <p>Em construção.</p>
  </main>
  <footer>Museum App · v0.1.0</footer>
</body>
</html>
